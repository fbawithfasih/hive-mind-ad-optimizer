[build]
buildCommand = "npm install && cd frontend && npm install && npm run build && cd .."

[deploy]
# Apply pending Prisma migrations before the new version goes live.
#
# Until this was added, `prisma migrate deploy` ran ONLY in CI (against the
# throwaway test database) — production schema was kept up to date solely by
# the idempotent raw-SQL blocks in src/server.js. Those are being retired in
# favour of the declarative migration history in prisma/migrations/.
#
# Prisma takes a Postgres advisory lock, so this is safe with multiple replicas.
# A failing migration fails the deploy and the previous version keeps serving.
preDeployCommand = ["npx prisma migrate deploy"]

# --import loads instrument.mjs before any application module, which the Sentry
# SDK requires: its auto-instrumentation patches http/express/pg at load time and
# sees nothing if the app is imported first. Inert when SENTRY_DSN is unset.
startCommand = "node --import ./instrument.mjs src/server.js"
# /ready, not /health. /health only proves the process is up, so a deployment
# that could not reach Postgres or Redis was declared healthy and replaced a
# working one. /ready probes both and 503s with per-dependency detail, so a
# broken deploy fails here and the previous version keeps serving.
healthcheckPath = "/ready"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
