name: Lighthouse Audit CI

on:
  workflow_dispatch:
  # Auto-triggers disabled — workflow file currently fails at parse time on
  # every push. Re-enable push/pull_request once the underlying issue is fixed.
  # push:
  #   branches: [main, develop]
  # pull_request:
  #   branches: [main, develop]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@*

      - name: Start dev server
        run: |
          cd frontend
          npm run preview &
          sleep 5
        timeout-minutes: 2

      - name: Run Lighthouse CI
        run: lhci autorun --config=.lighthouserc.json --upload.serverBaseUrl=http://localhost:9001
        timeout-minutes: 15

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouse/
          retention-days: 30

      - name: Parse and comment Lighthouse results
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .lighthouse/manifest.json ]; then
            PERFORMANCE=$(cat .lighthouse/manifest.json | jq -r '.[0].results[0].summary.performance // 0' | awk '{printf "%.0f", $1 * 100}')
            ACCESSIBILITY=$(cat .lighthouse/manifest.json | jq -r '.[0].results[0].summary.accessibility // 0' | awk '{printf "%.0f", $1 * 100}')
            BEST_PRACTICES=$(cat .lighthouse/manifest.json | jq -r '.[0].results[0].summary["best-practices"] // 0' | awk '{printf "%.0f", $1 * 100}')
            SEO=$(cat .lighthouse/manifest.json | jq -r '.[0].results[0].summary.seo // 0' | awk '{printf "%.0f", $1 * 100}')

            REPORT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            gh pr comment ${{ github.event.pull_request.number }} --body \
              "## 🔍 Lighthouse Audit Results

| Category | Score |
|----------|-------|
| Performance | $PERFORMANCE |
| Accessibility | $ACCESSIBILITY |
| Best Practices | $BEST_PRACTICES |
| SEO | $SEO |

[📊 Full Report]($REPORT_URL)"
          fi

      - name: Check Lighthouse CI results
        if: always()
        run: |
          if [ -f .lighthouse/manifest.json ]; then
            echo "✅ Lighthouse audit completed"
            cat .lighthouse/manifest.json | jq '.'
          else
            echo "⚠️ No Lighthouse results found"
          fi
