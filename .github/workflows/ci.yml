name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Backend tests — Jest against a real Postgres service container
  # ──────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: amaiop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/amaiop_test
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      ENCRYPTION_KEY: ci-test-encryption-key-32chars!
      REDIS_URL: ""   # tests mock BullMQ; Redis not needed in CI

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations (test DB)
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test -- --no-coverage --testPathIgnorePatterns="/.claude/worktrees/"

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend build check — catches Vite/TS compile errors before deploy
  # ──────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vite/Node 22 workaround)
        working-directory: frontend
        run: node node_modules/vite/dist/node/cli.js build

      # Colour bugs the build cannot see. Each rule matches a shape that has
      # shipped a visible defect and compiled without complaint.
      - name: Theme lint self-test
        working-directory: frontend
        run: node scripts/lint-theme.mjs --self-test

      - name: Theme lint
        working-directory: frontend
        run: node scripts/lint-theme.mjs
